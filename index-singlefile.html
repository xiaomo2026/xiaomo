    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f7f3ed;
            color: #4a3f35;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-layout { display: flex; height: calc(100vh - 48px - env(safe-area-inset-bottom)); }

        .top-bar {
            height: 48px; padding-top: env(safe-area-inset-top);
            box-sizing: content-box;
            display: flex; align-items: center; justify-content: center;
            background: #f7f3ed; border-bottom: 1px solid rgba(200, 170, 120, 0.1);
            font-size: 17px; font-weight: 700; color: #c4956a; flex-shrink: 0;
            letter-spacing: 1px;
        }
        .body-wrapper { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 72px; background: #f7f3ed; display: flex; flex-direction: column;
            align-items: center; padding: 12px 0; gap: 6px; flex-shrink: 0;
            overflow-y: auto; border-right: 1px solid rgba(200, 170, 120, 0.1);
        }
        .sidebar::-webkit-scrollbar { width: 0; }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 8px 4px; border-radius: 12px; cursor: pointer; transition: all 0.2s; width: 60px;
        }
        .nav-item:hover { background: rgba(200, 170, 120, 0.15); }
        .nav-item.active { background: rgba(200, 170, 120, 0.2); }

        .nav-icon {
            width: 38px; height: 38px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 20px; background: #e8dcc8;
        }
        .nav-item.active .nav-icon { background: #d4b896; }

        .nav-label { font-size: 10px; color: #8b7d6b; text-align: center; line-height: 1.2; }
        .nav-item.active .nav-label { color: #6b5b4a; font-weight: 600; }

        .content-area { flex: 1; overflow-y: auto; padding: 12px 16px 24px 8px; }
        .content-area::-webkit-scrollbar { width: 0; }

        .page-header { padding: 4px 0 16px; }
        .page-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .page-icon { font-size: 22px; }
        .page-title { font-size: 20px; font-weight: 700; color: #4a3f35; }
        .page-subtitle { font-size: 13px; color: #a09080; margin-bottom: 12px; padding-left: 32px; }
        .page-meta { display: flex; align-items: center; gap: 12px; padding-left: 32px; flex-wrap: wrap; }
        .date-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8b7d6b; }
        .date-badge .cal-icon {
            width: 22px; height: 22px; background: #e8dcc8; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #6b5b4a;
        }
        .auto-update { display: flex; align-items: center; gap: 4px; padding: 3px 10px; background: #e8f5e9; color: #4a8c4a; border-radius: 12px; font-size: 12px; }

        .dialogue-card { background: #fdf8f0; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(200, 170, 120, 0.15); }
        .dialogue-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #c4956a; margin-bottom: 16px; }
        .dialogue-title .icon { font-size: 20px; }
        .dialogue-line { display: flex; gap: 12px; margin-bottom: 14px; line-height: 1.7; }
        .dialogue-speaker { font-size: 15px; font-weight: 600; color: #c4956a; flex-shrink: 0; min-width: 52px; }
        .dialogue-text { font-size: 15px; color: #5a4d40; flex: 1; }
        .dialogue-hint { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(200, 170, 120, 0.2); }
        .dialogue-hint .bulb { font-size: 16px; flex-shrink: 0; }
        .dialogue-hint-text { font-size: 13px; color: #a09080; line-height: 1.7; }
        .dialogue-hint-text strong { color: #8b7d6b; font-weight: 600; }

        .tips-card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 16px; border: 1px solid rgba(200, 170, 120, 0.1); }
        .tips-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .tips-header .icon { font-size: 22px; }
        .tips-header h3 { font-size: 15px; font-weight: 700; color: #4a3f35; }
        .tips-header h3 span { color: #c4956a; }
        .tip-item { display: flex; gap: 10px; margin-bottom: 12px; line-height: 1.7; }
        .tip-item:last-child { margin-bottom: 0; }
        .tip-icon { font-size: 18px; flex-shrink: 0; }
        .tip-text { font-size: 14px; color: #6b5b4a; }
        .tip-text strong { color: #4a3f35; font-weight: 600; }

        .content-card { background: #fdf8f0; border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 1px solid rgba(200, 170, 120, 0.15); width: 100%; box-sizing: border-box; }
        .card-tag { display: inline-block; padding: 3px 10px; background: #e8dcc8; color: #6b5b4a; border-radius: 6px; font-size: 11px; font-weight: 600; margin-bottom: 10px; }
        .card-tag.green { background: #e8f5e9; color: #4a8c4a; }
        .card-title { font-size: 16px; font-weight: 700; color: #4a3f35; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: #8b7d6b; line-height: 1.6; margin-bottom: 12px; }
        .card-phrases { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .phrase-chip { padding: 5px 12px; background: white; color: #6b5b4a; border-radius: 8px; font-size: 13px; border: 1px solid rgba(200, 170, 120, 0.2); }
        .practice-btn { width: 100%; padding: 12px; background: #c4956a; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }

        .stats-card { background: #fdf8f0; border-radius: 16px; padding: 18px; margin-bottom: 16px; width: 100%; box-sizing: border-box; }
        .stats-title { font-size: 13px; color: #a09080; margin-bottom: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stats-item { text-align: center; }
        .stats-num { font-size: 20px; font-weight: 700; }
        .stats-num.green { color: #4a8c4a; }
        .stats-num.red { color: #e74c3c; }
        .stats-label { font-size: 11px; color: #a09080; margin-top: 4px; }

        .account-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(200, 170, 120, 0.1); display: flex; align-items: center; gap: 14px; width: 100%; }
        .account-card.expense .account-icon { background: #fce8e8; }
        .account-card.income .account-icon { background: #e8f5e9; }
        .account-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; background: #fdf8f0; }
        .account-info { flex: 1; min-width: 0; }
        .account-info-title { font-size: 15px; font-weight: 600; color: #4a3f35; }
        .account-info-desc { font-size: 12px; color: #a09080; margin-top: 2px; }
        .account-amount { font-size: 16px; font-weight: 700; }
        .account-amount.income { color: #4a8c4a; }
        .account-amount.expense { color: #e74c3c; }
        .account-delete { width: 28px; height: 28px; border: none; background: rgba(231, 76, 60, 0.1); color: #e74c3c; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .add-btn { width: 100%; padding: 14px; background: #c4956a; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-overlay.center { align-items: center; }
        .modal { background: #f7f3ed; width: 100%; max-width: 420px; border-radius: 20px 20px 0 0; padding: 24px 20px; animation: slideUp 0.3s ease; }
        .modal.center-modal { border-radius: 16px; text-align: center; padding: 33px 20px 27px; width: 280px; max-width: 280px; margin-top: -78px; }
        .confirm-text { font-size: 15px; color: #4a3f35; margin-bottom: 22px; line-height: 1.5; font-weight: 500; }
        .confirm-actions { display: flex; gap: 10px; }
        .confirm-actions .modal-btn { flex: 1; padding: 12px; font-size: 14px; border-radius: 10px; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 20px; color: #4a3f35; }
        .modal-field { margin-bottom: 16px; }
        .modal-label { font-size: 13px; color: #8b7d6b; margin-bottom: 6px; }
        .modal-input, .modal-select { width: 100%; padding: 12px 14px; border: 1px solid rgba(200, 170, 120, 0.3); border-radius: 10px; font-size: 15px; background: white; color: #4a3f35; outline: none; font-family: inherit; }
        .modal-input:focus, .modal-select:focus { border-color: #c4956a; }
        .type-toggle { display: flex; gap: 8px; }
        .type-btn { flex: 1; padding: 10px; border: 2px solid rgba(200, 170, 120, 0.3); border-radius: 10px; background: white; font-size: 14px; font-weight: 600; cursor: pointer; color: #8b7d6b; text-align: center; }
        .type-btn.active.expense { border-color: #e74c3c; color: #e74c3c; background: #fce8e8; }
        .type-btn.active.income { border-color: #4a8c4a; color: #4a8c4a; background: #e8f5e9; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .modal-btn.cancel { background: #e8dcc8; color: #8b7d6b; }
        .modal-btn.confirm { background: #c4956a; color: white; }

        .idea-card { background: #fdf8f0; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(200, 170, 120, 0.15); }
        .idea-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .idea-cat { font-size: 12px; color: #c4956a; font-weight: 600; }
        .idea-time { font-size: 11px; color: #c0b0a0; }
        .idea-title { font-size: 15px; font-weight: 600; color: #4a3f35; margin-bottom: 6px; }
        .idea-desc { font-size: 13px; color: #8b7d6b; line-height: 1.6; }

        .video-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid rgba(200, 170, 120, 0.15); }
        .video-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .video-title-row { display: flex; align-items: center; gap: 8px; flex: 1; }
        .video-title { font-size: 16px; font-weight: 700; color: #4a3f35; }
        .video-tag { padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; background: #e8f5e9; color: #4a8c4a; }
        .video-heat { font-size: 12px; color: #e67e22; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .video-why { font-size: 13px; color: #5a4f45; line-height: 1.7; margin-bottom: 10px; }
        .video-why strong { color: #4a8c4a; }
        .video-angle { font-size: 13px; color: #8b7d6b; line-height: 1.7; margin-bottom: 10px; }
        .video-angle strong { color: #c4956a; }
        .video-source { font-size: 11px; color: #c0b0a0; margin-bottom: 12px; }
        .video-link { display: inline-block; padding: 8px 16px; background: #4a8c4a; color: white; border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; margin-bottom: 10px; }
        .video-desc-box { background: #f5f5f0; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .video-desc-box span { font-size: 13px; color: #6b5b4a; line-height: 1.6; }
        .video-actions { display: flex; gap: 8px; }
        .video-action-btn { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
        .video-action-btn.primary { background: #4a8c4a; color: white; }
        .video-action-btn.secondary { background: white; color: #6b5b4a; border: 1px solid rgba(200,170,120,0.3); }
        .video-action-btn.ghost { background: white; color: #8b7d6b; border: 1px solid rgba(200,170,120,0.2); }

        .review-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(200, 170, 120, 0.1); }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .review-name { font-size: 15px; font-weight: 600; color: #4a3f35; }
        .review-rate { font-size: 13px; font-weight: 700; }
        .review-rate.up { color: #4a8c4a; }
        .review-rate.down { color: #e74c3c; }
        .review-stats { display: flex; gap: 16px; font-size: 13px; color: #8b7d6b; }
        .review-stat span { color: #4a3f35; font-weight: 600; }

        .memo-card { background: #fdf8f0; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(200, 170, 120, 0.15); }

        .word-card { background: #fdf8f0; border-radius: 16px; padding: 24px; margin-bottom: 14px; border: 1px solid rgba(200, 170, 120, 0.15); text-align: center; }
        .word-en { font-size: 26px; font-weight: 700; color: #4a3f35; margin-bottom: 6px; }
        .word-phonetic { font-size: 14px; color: #a09080; margin-bottom: 12px; }
        .word-cn { font-size: 16px; color: #c4956a; margin-bottom: 12px; }
        .word-example { font-size: 13px; color: #8b7d6b; line-height: 1.6; padding: 12px; background: white; border-radius: 10px; }

        /* 穿搭灵感卡片 */
        .outfit-card { background: #fdf8f0; border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 1px solid rgba(200, 170, 120, 0.15); }

        .outfit-style { display: inline-block; padding: 3px 10px; background: #e8dcc8; color: #6b5b4a; border-radius: 6px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
        .outfit-title { font-size: 16px; font-weight: 700; color: #4a3f35; margin-bottom: 8px; }
        .outfit-desc { font-size: 13px; color: #8b7d6b; line-height: 1.6; margin-bottom: 12px; }
        .outfit-items { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .outfit-item { padding: 5px 12px; background: white; color: #6b5b4a; border-radius: 8px; font-size: 13px; border: 1px solid rgba(200, 170, 120, 0.2); }
        .outfit-tip { display: flex; gap: 8px; padding-top: 12px; border-top: 1px dashed rgba(200, 170, 120, 0.2); }
        .outfit-tip .bulb { font-size: 16px; flex-shrink: 0; }

        .empty-state { text-align: center; padding: 80px 20px; color: #c0b0a0; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

        /* 语音朗读 & 跟读 */
        .speak-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; background: #c4956a; color: white;
            border: none; border-radius: 20px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .speak-btn:hover { background: #b8855a; transform: scale(1.05); }
        .speak-btn.speaking { background: #e74c3c; animation: pulse 1s infinite; }
        .speak-btn.slow { background: #8b7d6b; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

        .follow-section {
            margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(200, 170, 120, 0.3);
        }
        .follow-label { font-size: 13px; color: #a09080; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .follow-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .follow-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 20px; border: 2px solid #c4956a; background: white;
            color: #c4956a; border-radius: 25px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .follow-btn.recording { background: #e74c3c; border-color: #e74c3c; color: white; animation: pulse 1.2s infinite; }
        .follow-btn:hover { background: #fdf8f0; }
        .follow-btn.recording:hover { background: #e74c3c; }
        .follow-result {
            margin-top: 12px; padding: 14px; border-radius: 12px;
            font-size: 14px; line-height: 1.7; display: none;
        }
        .follow-result.show { display: block; }
        .follow-result.success { background: #e8f5e9; color: #2e7d32; }
        .follow-result.fail { background: #fce8e8; color: #c62828; }
        .follow-result.partial { background: #fff3e0; color: #e65100; }
        .follow-result strong { display: block; margin-bottom: 4px; }
        .follow-result .heard { font-size: 15px; margin-top: 6px; }
        .follow-result .accuracy { font-size: 20px; font-weight: 700; margin-top: 8px; }

        .word-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
        .word-follow-area { margin-top: 14px; }

        .dialogue-line-actions { margin-top: 6px; padding-left: 64px; display: flex; gap: 8px; flex-wrap: wrap; }
        .dialogue-cn { padding-left: 64px; font-size: 13px; color: #a09080; margin-bottom: 10px; line-height: 1.5; }
        .mini-speak {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 12px; background: rgba(196, 149, 106, 0.1); color: #c4956a;
            border: 1px solid rgba(196, 149, 106, 0.3); border-radius: 15px;
            font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .mini-speak:hover { background: #c4956a; color: white; }
        .mini-speak.speaking { background: #e74c3c; color: white; border-color: #e74c3c; }
        .mini-follow {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 12px; background: white; color: #8b7d6b;
            border: 1px solid rgba(200, 170, 120, 0.3); border-radius: 15px;
            font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .mini-follow:hover { background: #fdf8f0; border-color: #c4956a; color: #c4956a; }
        .mini-follow.recording { background: #e74c3c; color: white; border-color: #e74c3c; }

        .phrase-speak-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .phrase-speak-row .phrase-chip { cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.5; }
        .phrase-speak-row .phrase-chip:hover { background: #c4956a; color: white; border-color: #c4956a; }
        .phrase-speak-row .phrase-chip.speaking { background: #e74c3c; color: white; border-color: #e74c3c; animation: pulse 1s infinite; }

        /* 桌面/大屏预览：居中显示一个手机宽度的框 */
        @media (min-width: 500px) {
            body { max-width: 420px; margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,0.08); }
        }
        /* PWA 独立模式（添加到主屏幕后）：取消宽度限制，占满屏幕 */
        @media all and (display-mode: standalone) {
            body { max-width: 100% !important; margin: 0 !important; box-shadow: none !important; }
        }

        /* ========== 番茄钟样式 ========== */
        .pomodoro-container { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .pomodoro-timer-wrap { position: relative; width: 240px; height: 240px; margin-bottom: 24px; }
        .pomodoro-svg { transform: rotate(-90deg); }
        .pomodoro-bg-circle { fill: none; stroke: #e8dcc8; stroke-width: 12; }
        .pomodoro-progress-circle { fill: none; stroke: #c4956a; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
        .pomodoro-progress-circle.break-mode { stroke: #4a8c4a; }
        .pomodoro-progress-circle.long-break-mode { stroke: #5c6bc0; }
        .pomodoro-time-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .pomodoro-time-text { font-size: 48px; font-weight: 700; color: #4a3f35; font-variant-numeric: tabular-nums; }
        .pomodoro-mode-label { font-size: 13px; color: #a09080; margin-top: 4px; }
        .pomodoro-controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .pomo-btn { padding: 12px 24px; border: none; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .pomo-btn.primary { background: #c4956a; color: white; }
        .pomo-btn.primary:hover { background: #b8855a; }
        .pomo-btn.secondary { background: #e8dcc8; color: #6b5b4a; }
        .pomo-btn.ghost { background: white; color: #8b7d6b; border: 1px solid rgba(200,170,120,0.3); }
        .pomodoro-stats { background: #fdf8f0; border-radius: 16px; padding: 18px; width: 100%; text-align: center; }
        .pomodoro-count { font-size: 36px; font-weight: 700; color: #c4956a; }
        .pomodoro-count-label { font-size: 13px; color: #a09080; margin-top: 4px; }
        .pomodoro-session-info { font-size: 12px; color: #a09080; margin-top: 8px; }

        /* ========== 每日复盘样式 ========== */
        .review-date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .review-date-text { font-size: 16px; font-weight: 600; color: #4a3f35; }
        .review-weekday { font-size: 13px; color: #c4956a; background: #e8dcc8; padding: 3px 10px; border-radius: 8px; }
        .review-field { margin-bottom: 16px; }
        .review-field-label { font-size: 14px; font-weight: 600; color: #4a3f35; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .review-textarea { width: 100%; min-height: 100px; padding: 14px; border: 1px solid rgba(200,170,120,0.3); border-radius: 12px; font-size: 14px; background: #fdf8f0; color: #4a3f35; outline: none; font-family: inherit; resize: vertical; line-height: 1.7; display: block; box-sizing: border-box; }
        .review-textarea:focus { border-color: #c4956a; }
        .review-save-hint { font-size: 12px; color: #4a8c4a; margin-top: 6px; display: none; }
        .review-save-hint.show { display: block; }
        .review-yesterday { background: white; border-radius: 14px; padding: 16px; margin-top: 20px; border: 1px solid rgba(200,170,120,0.1); }
        .review-yesterday-title { font-size: 14px; font-weight: 600; color: #c4956a; margin-bottom: 10px; }
        .review-yesterday-content { font-size: 13px; color: #8b7d6b; line-height: 1.7; }
        .review-yesterday-empty { font-size: 13px; color: #c0b0a0; font-style: italic; }
        .review-history-btn { width: 100%; padding: 12px; background: #e8dcc8; color: #6b5b4a; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .review-history-item { background: #fdf8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid rgba(200,170,120,0.15); }
        .review-history-date { font-size: 14px; font-weight: 600; color: #c4956a; margin-bottom: 8px; }

        /* ========== 设置页面样式 ========== */
        .settings-section { background: #fdf8f0; border-radius: 16px; padding: 18px; margin-bottom: 16px; border: 1px solid rgba(200,170,120,0.15); }
        .settings-section-title { font-size: 15px; font-weight: 700; color: #4a3f35; margin-bottom: 14px; }
        .settings-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
        .settings-stat-item { background: white; border-radius: 12px; padding: 14px; text-align: center; }
        .settings-stat-num { font-size: 24px; font-weight: 700; color: #c4956a; }
        .settings-stat-label { font-size: 12px; color: #a09080; margin-top: 4px; }
        .settings-big-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .settings-big-btn.export { background: #c4956a; color: white; }
        .settings-big-btn.import { background: #4a8c4a; color: white; }
        .settings-big-btn.danger { background: #fce8e8; color: #e74c3c; border: 1px solid rgba(231,76,60,0.2); }
        .settings-file-input { display: none; }
        .settings-info { font-size: 12px; color: #a09080; line-height: 1.6; margin-top: 8px; }
    </style>
</head>

        function dayOfYear() { const d = new Date(); const start = new Date(d.getFullYear(), 0, 0); return Math.floor((d - start) / 86400000); }
        function pick(arr, offset = 0) { return arr[(dayOfYear() - 1 + offset + arr.length * 100) % arr.length]; }
        function pickN(arr, n, offset = 0) {
            const start = ((dayOfYear() - 1 + offset) * n + arr.length * n * 100) % arr.length;
            const result = [];
            for (let i = 0; i < n; i++) { result.push(arr[(start + i) % arr.length]); }
            return result;
        }

        const enVoicePriority = [

            'Daniel',                       // macOS 英国男声
            'Karen',                        // macOS 澳洲女声
        ];

        // 粤语发音人优先级
        const yueVoicePriority = [
            'Google 粤語（香港）',
            'Google Cantonese',
            'Microsoft HiuGaai Online (Natural) - Chinese (Cantonese, Traditional)',
            'Microsoft HuiSha Online (Natural) - Chinese (Cantonese, Traditional)',

        function pickBestVoice(lang) {
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return null;

            let priority = [];
            if (lang && lang.startsWith('en')) {
                priority = enVoicePriority;
            } else if (lang && (lang.includes('HK') || lang.includes('HK') || lang === 'zh-HK')) {
                priority = yueVoicePriority;
            }

            // 1. 精确匹配优先级列表
            for (const name of priority) {
                const v = voices.find(v => v.name === name);
                if (v) return v;
            }

            // 2. 匹配 lang 的本地语音
            const langMatches = voices.filter(v => v.lang === lang);
            if (langMatches.length) {
                // 优先选女声（通常更清晰）
                const female = langMatches.find(v => /female|aria|jenny|zira|samantha|karen|hiugaai|huisha|sin-ji/i.test(v.name));
                if (female) return female;
                return langMatches[0];
            }

            // 3. 匹配语言前缀
            const prefix = lang ? lang.split('-')[0] : '';
            const prefixMatches = voices.filter(v => v.lang.startsWith(prefix));
            if (prefixMatches.length) return prefixMatches[0];

            return null;
        }

        function speakText(btn, text, lang, rate) {
            // 如果正在朗读，先停止
            if (currentUtterance) {
                window.speechSynthesis.cancel();
                document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
                if (btn && btn.classList.contains('speaking')) return;
            }

            if (!window.speechSynthesis) {
                alert('您的浏览器不支持语音朗读功能');
                return;
            }

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = lang || 'en-US';
            // 英语和粤语默认稍慢一点，更清晰
            if (lang && lang.startsWith('en')) {
                utter.rate = rate || 0.9;
            } else {
                utter.rate = rate || 0.95;
            }
            utter.pitch = 1;       // 标准音调
            utter.volume = 1;

            // 选择最佳发音人
            const bestVoice = pickBestVoice(utter.lang);
            if (bestVoice) utter.voice = bestVoice;

            if (btn) btn.classList.add('speaking');
            currentUtterance = utter;

            utter.onend = () => {
                if (btn) btn.classList.remove('speaking');
                currentUtterance = null;
            };
            utter.onerror = () => {
                if (btn) btn.classList.remove('speaking');
                currentUtterance = null;
            };

            // Chrome bug: 有时需要先 cancel 再 speak
            window.speechSynthesis.cancel();
            setTimeout(() => window.speechSynthesis.speak(utter), 50);
        }

        // 语音识别跟读
        let recognition = null;
        let activeFollowBtn = null;

        function initRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const rec = new SR();
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 3;
            return rec;
        }

        function levenshtein(s1, s2) {
            const m = s1.length, n = s2.length;
            const d = Array.from({length: m+1}, () => new Array(n+1).fill(0));
            for (let i = 0; i <= m; i++) d[i][0] = i;
            for (let j = 0; j <= n; j++) d[0][j] = j;
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    const cost = s1[i-1].toLowerCase() === s2[j-1].toLowerCase() ? 0 : 1;
                    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
                }
            }
            return d[m][n];
        }

        function calcAccuracy(spoken, target) {
            const s = spoken.toLowerCase().replace(/[^a-z\u4e00-\u9fff\s]/g, '').trim();
            const t = target.toLowerCase().replace(/[^a-z\u4e00-\u9fff\s]/g, '').trim();
            if (!t) return 0;
            if (!s) return 0;
            const dist = levenshtein(s, t);
            const maxLen = Math.max(s.length, t.length);
            return Math.round((1 - dist / maxLen) * 100);
        }

        function startFollow(btn, targetText, lang) {
            // 如果正在录音，先停止
            if (recognition && activeFollowBtn) {
                recognition.stop();
                activeFollowBtn.classList.remove('recording');
                activeFollowBtn = null;
                return;
            }

            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                alert('您的浏览器不支持语音识别功能，请使用 Chrome 或 Edge 浏览器');
                return;
            }

            // 先朗读一遍
            speakText(null, targetText, lang);

            // 朗读结束后开始录音
            const speakTimer = setTimeout(() => {
                recognition = initRecognition();
                if (!recognition) {
                    alert('语音识别初始化失败');
                    return;
                }
                recognition.lang = lang || 'en-US';

                btn.classList.add('recording');
                activeFollowBtn = btn;
                btn.innerHTML = '⏹️ 停止录音';

                // 找到结果容器
                const card = btn.closest('.dialogue-line-actions') || btn.closest('.follow-section');
                let resultDiv = card ? card.parentElement.querySelector('.follow-result') : null;
                if (!resultDiv) {
                    resultDiv = btn.closest('.word-card, .content-card, .dialogue-card')?.querySelector('.follow-result');
                }

                recognition.onresult = (event) => {
                    const spoken = event.results[0][0].transcript;
                    const accuracy = calcAccuracy(spoken, targetText);

                    let cls = 'fail', label = '再试一次';
                    if (accuracy >= 80) { cls = 'success'; label = '太棒了！'; }
                    else if (accuracy >= 60) { cls = 'partial'; label = '不错，继续努力'; }

                    if (resultDiv) {
                        resultDiv.className = 'follow-result show ' + cls;
                        resultDiv.innerHTML = `
                            <strong>${label}</strong>
                            <div>目标：${targetText}</div>
                            <div class="heard">你说：${spoken}</div>
                            <div class="accuracy">准确度：${accuracy}%</div>
                        `;
                    }
                };

                recognition.onerror = (event) => {
                    if (resultDiv) {
                        resultDiv.className = 'follow-result show fail';
                        resultDiv.innerHTML = '<strong>未识别到语音</strong><div>请检查麦克风权限，或点击重试</div>';
                    }
                };

                recognition.onend = () => {
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎤 跟读';
                    activeFollowBtn = null;
                };

                try {
                    recognition.start();
                } catch(e) {
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎤 跟读';
                    activeFollowBtn = null;
                }
            }, targetText.length * 80 + 500);
        }

        function startFollowPhrase(btn, targetText, lang) {
            startFollow(btn, targetText, lang);
        }

        // 预加载语音列表
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // ========== 番茄钟功能 ==========
        let pomoTimer = null;
        let pomoSecondsLeft = 25 * 60;
        let pomoTotalSeconds = 25 * 60;
        let pomoIsRunning = false;
        let pomoMode = 'work'; // work, short-break, long-break
        let pomoWorkCount = 0; // 本轮已完成的工作番茄数（0-3）

        const POMO_WORK = 25 * 60;
        const POMO_SHORT_BREAK = 5 * 60;
        const POMO_LONG_BREAK = 15 * 60;

        function getTodayDateStr() {
            const d = new Date();
            return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        }

        function getYesterdayDateStr() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        }

        function getYesterdayDisplayStr() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return `${d.getMonth()+1}月${d.getDate()}日`;
        }

        function getPomodoroCount() {
            const today = getTodayDateStr();
            try {
                const data = JSON.parse(localStorage.getItem('xm_pomodoro_today') || '{}');
                if (data.date === today) return data.count || 0;
            } catch(e) {}
            return 0;
        }

        function getPomodoroSessionInfo() {
            const count = getPomodoroCount();
            const inCycle = count % 4;
            if (inCycle === 0) return '本轮已完成 0/4，继续加油';
            return `本轮已完成 ${inCycle}/4，再完成 ${4 - inCycle} 个进入长休息`;
        }

        function incrementPomodoroCount() {
            const today = getTodayDateStr();
            let data;
            try { data = JSON.parse(localStorage.getItem('xm_pomodoro_today') || '{}'); } catch(e) { data = {}; }
            if (data.date !== today) data = { date: today, count: 0 };
            data.count = (data.count || 0) + 1;
            data.date = today;
            localStorage.setItem('xm_pomodoro_today', JSON.stringify(data));
            localStorage.setItem('xm_pomodoro_count', String(data.count));
        }

        function pomoInit() {
            pomoUpdateDisplay();
        }

        function pomoPauseForNavigation() {
            // 计时器继续在后台运行，不停止
        }

        function pomoUpdateDisplay() {
            const mins = Math.floor(pomoSecondsLeft / 60);
            const secs = pomoSecondsLeft % 60;
            const timeText = document.getElementById('pomoTimeText');
            const modeLabel = document.getElementById('pomoModeLabel');
            const progress = document.getElementById('pomoProgress');
            const startBtn = document.getElementById('pomoStartBtn');
            if (!timeText) return;

            timeText.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            const modeTexts = { 'work': '专注工作中', 'short-break': '短休息中', 'long-break': '长休息中' };
            modeLabel.textContent = modeTexts[pomoMode] || '专注工作中';
            startBtn.textContent = pomoIsRunning ? '⏸ 暂停' : '▶ 开始';

            // 更新圆环进度
            const circumference = 2 * Math.PI * 108; // ≈ 678.58
            const progressRatio = pomoTotalSeconds > 0 ? pomoSecondsLeft / pomoTotalSeconds : 0;
            const offset = circumference * (1 - progressRatio);
            progress.setAttribute('stroke-dashoffset', offset);

            // 更新圆环颜色
            progress.classList.remove('break-mode', 'long-break-mode');
            if (pomoMode === 'short-break') progress.classList.add('break-mode');
            if (pomoMode === 'long-break') progress.classList.add('long-break-mode');
        }

        function pomoToggle() {
            if (pomoIsRunning) {
                pomoPause();
            } else {
                pomoStart();
            }
        }

        function pomoStart() {
            if (pomoIsRunning) return;
            pomoIsRunning = true;
            pomoTimer = setInterval(() => {
                pomoSecondsLeft--;
                if (pomoSecondsLeft <= 0) {
                    pomoComplete();
                } else {
                    pomoUpdateDisplay();
                }
            }, 1000);
            pomoUpdateDisplay();
        }

        function pomoPause() {
            pomoIsRunning = false;
            if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; }
            pomoUpdateDisplay();
        }

        function pomoReset() {
            pomoPause();
            if (pomoMode === 'work') pomoSecondsLeft = POMO_WORK;
            else if (pomoMode === 'short-break') pomoSecondsLeft = POMO_SHORT_BREAK;
            else pomoSecondsLeft = POMO_LONG_BREAK;
            pomoTotalSeconds = pomoSecondsLeft;
            pomoUpdateDisplay();
        }

        function pomoSkip() {
            pomoComplete();
        }

        function pomoComplete() {
            pomoPause();
            pomoBeep();
            // 发送通知
            if ('Notification' in window && Notification.permission === 'granted') {
                const modeText = pomoMode === 'work' ? '工作番茄完成！' : '休息结束！';
                new Notification('🍅 番茄钟', { body: modeText + '该切换模式了。' });
            }

            if (pomoMode === 'work') {
                incrementPomodoroCount();
                pomoWorkCount++;
                if (pomoWorkCount >= 4) {
                    pomoWorkCount = 0;
                    pomoMode = 'long-break';
                    pomoSecondsLeft = POMO_LONG_BREAK;
                } else {
                    pomoMode = 'short-break';
                    pomoSecondsLeft = POMO_SHORT_BREAK;
                }
            } else {
                pomoMode = 'work';
                pomoSecondsLeft = POMO_WORK;
            }
            pomoTotalSeconds = pomoSecondsLeft;
            pomoUpdateDisplay();
            // 更新计数显示
            const countEl = document.getElementById('pomoCount');
            if (countEl) countEl.textContent = getPomodoroCount();
            const sessionInfo = document.getElementById('pomoSessionInfo') || document.querySelector('.pomodoro-session-info');
            if (sessionInfo) sessionInfo.textContent = getPomodoroSessionInfo();
            // 自动开始休息
            pomoStart();
        }

        function pomoBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 880;
                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        // 请求通知权限
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // ========== 每日复盘功能 ==========
        function loadDailyReview(dateStr) {
            try {
                return JSON.parse(localStorage.getItem('xm_review_' + dateStr) || '{}');
            } catch(e) { return {}; }
        }

        function saveDailyReview() {
            const dateStr = getTodayDateStr();
            const review = {
                done: document.getElementById('reviewDone').value,
                gain: document.getElementById('reviewGain').value,
                plan: document.getElementById('reviewPlan').value
            };
            localStorage.setItem('xm_review_' + dateStr, JSON.stringify(review));
            const hint = document.getElementById('reviewSaveHint');
            if (hint) {
                hint.classList.add('show');
                setTimeout(() => hint.classList.remove('show'), 2000);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function showReviewHistory() {
            const modal = document.getElementById('reviewHistoryModal');
            const content = document.getElementById('reviewHistoryContent');
            const reviews = [];
            const today = new Date();
            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
                const review = loadDailyReview(dateStr);
                const displayDate = `${d.getMonth()+1}月${d.getDate()}日 ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]}`;
                if (review.done || review.gain || review.plan) {
                    reviews.push({ date: displayDate, review });
                }
            }
            if (reviews.length === 0) {
                content.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#c0b0a0;">最近 7 天暂无复盘记录</div>';
            } else {
                content.innerHTML = reviews.map(r => `
                    <div class="review-history-item">
                        <div class="review-history-date">${r.date}</div>
                        ${r.review.done ? `<div style="font-size:13px;color:#5a4f45;margin-bottom:6px;"><strong>✅ 完成：</strong>${escapeHtml(r.review.done)}</div>` : ''}
                        ${r.review.gain ? `<div style="font-size:13px;color:#5a4f45;margin-bottom:6px;"><strong>💡 收获：</strong>${escapeHtml(r.review.gain)}</div>` : ''}
                        ${r.review.plan ? `<div style="font-size:13px;color:#5a4f45;"><strong>📋 计划：</strong>${escapeHtml(r.review.plan)}</div>` : ''}
                    </div>
                `).join('');
            }
            modal.classList.add('show');
        }

        function closeReviewHistoryModal() {
            document.getElementById('reviewHistoryModal').classList.remove('show');
        }
        document.addEventListener('DOMContentLoaded', () => {
            const m = document.getElementById('reviewHistoryModal');
            if (m) m.addEventListener('click', (e) => { if (e.target.id === 'reviewHistoryModal') closeReviewHistoryModal(); });
        });

        // ========== 数据导出/导入功能 ==========
        function getDataStats() {
            const stats = { plans: 0, accounts: 0, memos: 0, orders: 0, commissions: 0, reviews: 0 };
            try {
                stats.plans = JSON.parse(localStorage.getItem('xm_plans') || '[]').length;
            } catch(e) {}
            try {
                stats.accounts = JSON.parse(localStorage.getItem('xm_accounts') || '[]').length;
            } catch(e) {}
            try {
                stats.memos = JSON.parse(localStorage.getItem('xm_memos') || '[]').length;
            } catch(e) {}
            try {
                stats.orders = JSON.parse(localStorage.getItem('xm_orders') || '[]').length;
            } catch(e) {}
            try {
                stats.commissions = JSON.parse(localStorage.getItem('xm_commissions') || '[]').length;
            } catch(e) {}
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('xm_review_')) stats.reviews++;
            }
            return stats;
        }

        function exportData() {
            const data = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('xm_')) {
                    data[key] = localStorage.getItem(key);
                }
            }
            const dateStr = getTodayDateStr();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `xiaomo-backup-${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('数据已导出！');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!confirm('导入数据将覆盖现有数据，确定继续吗？')) {
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    let count = 0;
                    for (const key in data) {
                        if (key.startsWith('xm_')) {
                            localStorage.setItem(key, data[key]);
                            count++;
                        }
                    }
                    alert(`成功导入 ${count} 条数据！请刷新页面查看。`);
                    // 重新加载当前页面
                    const activeNav = document.querySelector('.nav-item.active');
                    if (activeNav) renderPage(activeNav.dataset.page);
                } catch(err) {
                    alert('导入失败：文件格式错误');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            showConfirmModal('确定要清空所有数据吗？此操作不可撤销！', () => {
                const keysToDelete = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('xm_')) keysToDelete.push(key);
                }
                keysToDelete.forEach(k => localStorage.removeItem(k));
                alert('所有数据已清空！');
                // 重新加载变量
                try { plans = JSON.parse(JSON.stringify(defaultPlans)); } catch(e) {}
                try { memos = JSON.parse(JSON.stringify(defaultMemos)); } catch(e) {}
                try { accounts = []; } catch(e) {}
                try { orders = []; } catch(e) {}
                try { commissions = []; } catch(e) {}
                const activeNav = document.querySelector('.nav-item.active');
                if (activeNav) renderPage(activeNav.dataset.page);
            });
        }

        // ========== 视频播放模态框 ==========
        let currentVideoLink = '';
        function openVideoModal(title, link) {
            currentVideoLink = link;
            document.getElementById('videoModalTitle').textContent = title;
            document.getElementById('videoModal').classList.add('show');
        }

        function closeVideoModal() {
            document.getElementById('videoModal').classList.remove('show');
        }

        document.getElementById('videoModal').addEventListener('click', (e) => {
            if (e.target.id === 'videoModal') closeVideoModal();
        });

        document.getElementById('videoOpenBrowser').addEventListener('click', () => {
            window.open(currentVideoLink, '_blank');
            closeVideoModal();
        });

        document.getElementById('videoOpenDouyin').addEventListener('click', () => {
            // 尝试 deeplink，失败则 fallback 到浏览器打开
            const keyword = extractDouyinKeyword(currentVideoLink);
            // 尝试通过 snssdk1128 deeplink 打开抖音搜索
            const deeplink = `snssdk1128://search?keyword=${encodeURIComponent(keyword)}`;
            const fallbackLink = currentVideoLink;
            // 先尝试打开 deeplink，1.5秒后检测是否还在页面
            const start = Date.now();
            window.location.href = deeplink;
            setTimeout(() => {
                if (Date.now() - start < 2000) {
                    // deeplink 可能失败，fallback 到浏览器
                    window.open(fallbackLink, '_blank');
                }
            }, 1500);
            closeVideoModal();
        });

        function extractDouyinKeyword(link) {
            // 从 https://www.douyin.com/search/关键词 提取关键词
            try {
                const url = new URL(link);
                const path = url.pathname;
                if (path.startsWith('/search/')) {
                    return decodeURIComponent(path.replace('/search/', ''));
                }
            } catch(e) {}
            return link;
        }

        // ========== 导航 ==========
        function renderPage(pageKey) {
            const data = pageData[pageKey];
            if (!data) return;
            contentArea.innerHTML = data.render();
            contentArea.scrollTop = 0;
            // 页面渲染后初始化
            if (pageKey === 'pomodoro') pomoInit();
        }

        sidebar.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                sidebar.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                // 离开番茄钟页面时暂停计时器更新
                if (item.dataset.page !== 'pomodoro') pomoPauseForNavigation();
                renderPage(item.dataset.page);
            });
        });

        renderPage('speaking');
    </script>
</body>
