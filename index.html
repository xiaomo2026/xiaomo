        function pick(arr, offset = 0) { return arr[(dayOfYear() - 1 + offset + arr.length * 100) % arr.length]; }
        function pickN(arr, n, offset = 0) {
            const start = ((dayOfYear() - 1 + offset) * n + arr.length * n * 100) % arr.length;
            const result = [];
            for (let i = 0; i < n; i++) { result.push(arr[(start + i) % arr.length]); }
            return result;

            const chatArea = document.getElementById('aiChatArea');

            chatArea.innerHTML += `<div class="ai-msg user">${text}</div>`;
            input.value = '';

            const loadingId = 'aiLoading_' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'ai-msg bot';
            loadingDiv.innerHTML = '正在思考中...';
            loadingDiv.id = loadingId;
            chatArea.appendChild(loadingDiv);
            const scroll = document.getElementById('aiChatScroll');
            scroll.scrollTop = scroll.scrollHeight;

            // 如果填了 API Key，调用豆包大模型
            if (ARK_API_KEY) {
                aiHistory.push({ role: 'user', content: text });

                fetch(ARK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + ARK_API_KEY
                    },
                    body: JSON.stringify({
                        model: ARK_MODEL,
                        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...aiHistory]
                    })
                })
                .then(res => res.json())
                .then(data => {
                    const reply = data.choices[0].message.content;
                    aiHistory.push({ role: 'assistant', content: reply });
                    const el = document.getElementById(loadingId);
                    if (el) el.innerHTML = reply.replace(/\n/g, '<br>');
                    scroll.scrollTop = scroll.scrollHeight;
                })
                .catch(err => {
                    const el = document.getElementById(loadingId);
                    if (el) el.innerHTML = '网络错误，请稍后重试 😥';
                    scroll.scrollTop = scroll.scrollHeight;
                });
            } else {
                // 未填 API Key，使用本地回复
                setTimeout(() => {
                    let reply = aiReplies['default'];
                    for (const key in aiReplies) {
                        if (key !== 'default' && text.includes(key)) { reply = aiReplies[key]; break; }

                    if (el) el.innerHTML = reply;

                    <div class="stats-grid">
                        <div class="stats-item"><div class="stats-num green">${totalOrders}</div><div class="stats-label">总出单量</div></div>
                        <div class="stats-item"><div class="stats-num red">${totalReturns}</div><div class="stats-label">总退货量</div></div>
                        <div class="stats-item"><div class="stats-num">${net}</div><div class="stats-label">净出单</div></div>
                    </div>
                </div>
                ${orders.map((o, i) => `
                    <div class="content-card" style="display:flex;flex-direction:column;gap:6px;padding:14px 16px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="flex:1;font-size:15px;color:#4a3f35;font-weight:600;">${o.product}</div>
                            <span style="padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#e8f5e9;color:#4a8c4a;">出单 ${o.orderCount}</span>
                            <span style="padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#fce8e8;color:#e74c3c;">退货 ${o.returnCount}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div style="font-size:12px;color:#c0b0a0;">${o.date}</div>
                            <div style="display:flex;gap:8px;">
                                <button class="account-delete" style="background:rgba(196,149,106,0.1);color:#c4956a;" onclick="editOrder(${i})">✏️</button>
                                <button class="account-delete" onclick="confirmDeleteOrder(${i})">×</button>
                            </div>
                        </div>
                    </div>
                `).join('')}
                <button class="add-btn" onclick="openOrderModal()">+ 新增单量</button>
            `;
        }

        let editingOrderIdx = -1;
        function openOrderModal(idx) {
            editingOrderIdx = idx !== undefined ? idx : -1;
            const o = idx !== undefined ? orders[idx] : { product: '', orderCount: 0, returnCount: 0 };
            document.getElementById('orderModalTitle').textContent = idx !== undefined ? '编辑单量' : '新增单量';
            document.getElementById('orderProduct').value = o.product;
            document.getElementById('orderCount').value = o.orderCount;
            document.getElementById('returnCount').value = o.returnCount;
            document.getElementById('orderModal').classList.add('show');
        }
        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('show');
            editingOrderIdx = -1;
        }
        function saveOrder() {
            const product = document.getElementById('orderProduct').value.trim();
            const orderCount = parseInt(document.getElementById('orderCount').value) || 0;
            const returnCount = parseInt(document.getElementById('returnCount').value) || 0;
            if (!product) { alert('请填写产品名称'); return; }
            const d = new Date();
            const date = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            if (editingOrderIdx >= 0) {
                orders[editingOrderIdx] = { ...orders[editingOrderIdx], product, orderCount, returnCount };
            } else {
                orders.push({ product, orderCount, returnCount, date });
            }
            saveOrders(); closeOrderModal();
            contentArea.innerHTML = renderPageHeader('📦', '今日单量', '记录每日出单与退货 · 点击增删改', false) + renderOrderList();
        }
        function editOrder(idx) { openOrderModal(idx); }
        function confirmDeleteOrder(idx) { showConfirmModal('确定要删除这条单量记录吗？', () => deleteOrder(idx)); }
        function deleteOrder(idx) { orders.splice(idx, 1); saveOrders(); contentArea.innerHTML = renderPageHeader('📦', '今日单量', '记录每日出单与退货 · 点击增删改', false) + renderOrderList(); }

        // ========== 佣金收入功能（可增删改）==========
        let commissions = [];
        try { const saved = localStorage.getItem('xm_commissions'); if (saved) commissions = JSON.parse(saved); } catch(e) {}

        function saveCommissions() { localStorage.setItem('xm_commissions', JSON.stringify(commissions)); }

        function renderCommissionList() {
            if (commissions.length === 0) {
                return `<div class="empty-state"><div class="empty-icon">💵</div><div class="empty-text">还没有佣金记录<br>点击下方按钮开始记录</div></div><button class="add-btn" onclick="openCommissionModal()">+ 新增佣金</button>`;
            }
            const now = new Date();
            const thisMonth = now.getMonth();
            const thisYear = now.getFullYear();
            const monthCommissions = commissions.filter(c => {
                const d = new Date(c.timestamp || 0);
                return d.getMonth() === thisMonth && d.getFullYear() === thisYear;
            });
            const monthTotal = monthCommissions.reduce((s, c) => s + c.commission, 0);
            const yearCommissions = commissions.filter(c => {
                const d = new Date(c.timestamp || 0);
                return d.getFullYear() === thisYear;
            });
            const yearTotal = yearCommissions.reduce((s, c) => s + c.commission, 0);
            const allTotal = commissions.reduce((s, c) => s + c.commission, 0);

            return `
                <div class="stats-card">
                    <div class="stats-title">累计佣金</div>
                    <div class="stats-grid">
                        <div class="stats-item"><div class="stats-num green">¥${allTotal.toFixed(2)}</div><div class="stats-label">总佣金</div></div>
                        <div class="stats-item"><div class="stats-num">¥${yearTotal.toFixed(2)}</div><div class="stats-label">本年</div></div>
                        <div class="stats-item"><div class="stats-num">¥${monthTotal.toFixed(2)}</div><div class="stats-label">本月</div></div>
                    </div>
                </div>
                ${commissions.slice().reverse().map((c, i) => {
                    const realIdx = commissions.length - 1 - i;
                    return `<div class="content-card" style="display:flex;flex-direction:column;gap:6px;padding:14px 16px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="flex:1;font-size:15px;color:#4a3f35;font-weight:600;">${c.product}</div>
                            <span style="font-size:16px;font-weight:700;color:#4a8c4a;">+¥${c.commission.toFixed(2)}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div style="font-size:12px;color:#8b7d6b;">出单 ${c.count} · 佣金率 ${c.rate}% · 客单价 ¥${c.price} · ${c.date}</div>
                            <div style="display:flex;gap:8px;">
                                <button class="account-delete" style="background:rgba(196,149,106,0.1);color:#c4956a;" onclick="editCommission(${realIdx})">✏️</button>
                                <button class="account-delete" onclick="confirmDeleteCommission(${realIdx})">×</button>
                            </div>
                        </div>
                    </div>`;
                }).join('')}
                <button class="add-btn" onclick="openCommissionModal()">+ 新增佣金</button>
            `;
        }

        let editingCommissionIdx = -1;
        function openCommissionModal(idx) {
            editingCommissionIdx = idx !== undefined ? idx : -1;
            const c = idx !== undefined ? commissions[idx] : null;
            document.getElementById('commissionModalTitle').textContent = idx !== undefined ? '编辑佣金' : '新增佣金';
            if (c) {
                document.getElementById('commissionProduct').value = c.product;
                document.getElementById('commissionCount').value = c.count;
                document.getElementById('commissionRate').value = c.rate;
                document.getElementById('commissionPrice').value = c.price;
            } else {
                document.getElementById('commissionProduct').value = '';
                document.getElementById('commissionCount').value = '';
                document.getElementById('commissionRate').value = '';
                document.getElementById('commissionPrice').value = '';
            }
            document.getElementById('commissionModal').classList.add('show');
        }
        function closeCommissionModal() {
            document.getElementById('commissionModal').classList.remove('show');
            editingCommissionIdx = -1;
        }
        function saveCommission() {
            const product = document.getElementById('commissionProduct').value.trim();
            const count = parseInt(document.getElementById('commissionCount').value) || 0;
            const rate = parseFloat(document.getElementById('commissionRate').value) || 0;
            const price = parseFloat(document.getElementById('commissionPrice').value) || 0;
            if (!product) { alert('请填写产品名称'); return; }
            if (!count || !price) { alert('请填写出单数和客单价'); return; }
            const commission = count * price * rate / 100;
            const d = new Date();
            const date = `${d.getMonth()+1}月${d.getDate()}日`;
            if (editingCommissionIdx >= 0) {
                commissions[editingCommissionIdx] = { ...commissions[editingCommissionIdx], product, count, rate, price, commission };
            } else {
                commissions.push({ product, count, rate, price, commission, date, timestamp: d.getTime() });
            }
            saveCommissions(); closeCommissionModal();
            contentArea.innerHTML = renderPageHeader('💵', '佣金收入', '记录每笔带货佣金 · 点击增删改', false) + renderCommissionList();
        }
        function editCommission(idx) { openCommissionModal(idx); }
        function confirmDeleteCommission(idx) { showConfirmModal('确定要删除这条佣金记录吗？', () => deleteCommission(idx)); }
        function deleteCommission(idx) { commissions.splice(idx, 1); saveCommissions(); contentArea.innerHTML = renderPageHeader('💵', '佣金收入', '记录每笔带货佣金 · 点击增删改', false) + renderCommissionList(); }

        // ========== 删除确认弹窗 ==========
        let confirmCallback = null;
        function showConfirmModal(text, callback) {
            document.getElementById('confirmText').textContent = text;
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.add('show');
        }
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            confirmCallback = null;
        }
        document.getElementById('confirmOkBtn').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        });

        // ========== 语音朗读 & 跟读功能 ==========
        let currentUtterance = null;

        // 英语优质发音人优先级列表（清晰标准的女声/男声）
        const enVoicePriority = [
            'Google US English',           // Chrome 内置，非常清晰
            'Microsoft Aria Online (Natural) - English (United States)',
            'Microsoft Jenny Online (Natural) - English (United States)',
            'Microsoft Guy Online (Natural) - English (United States)',
            'Microsoft Zira - English (United States)',  // Windows 经典女声
            'Microsoft David - English (United States)',  // Windows 经典男声
            'Samantha',                     // macOS/iOS 内置女声
            'Alex',                         // macOS 内置男声
            'Google UK English Female',
            'Google UK English Male',
            'Daniel',                       // macOS 英国男声
            'Karen',                        // macOS 澳洲女声
        ];

        // 粤语发音人优先级
        const yueVoicePriority = [
            'Google 粤語（香港）',
            'Google Cantonese',
            'Microsoft HiuGaai Online (Natural) - Chinese (Cantonese, Traditional)',
            'Microsoft HuiSha Online (Natural) - Chinese (Cantonese, Traditional)',
            'Sin-ji',                       // macOS 粤语女声
        ];

        function pickBestVoice(lang) {
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return null;

            let priority = [];
            if (lang && lang.startsWith('en')) {
                priority = enVoicePriority;
            } else if (lang && (lang.includes('HK') || lang.includes('HK') || lang === 'zh-HK')) {
                priority = yueVoicePriority;
            }

            // 1. 精确匹配优先级列表
            for (const name of priority) {
                const v = voices.find(v => v.name === name);
                if (v) return v;
            }

            // 2. 匹配 lang 的本地语音
            const langMatches = voices.filter(v => v.lang === lang);
            if (langMatches.length) {
                // 优先选女声（通常更清晰）
                const female = langMatches.find(v => /female|aria|jenny|zira|samantha|karen|hiugaai|huisha|sin-ji/i.test(v.name));
                if (female) return female;
                return langMatches[0];
            }

            // 3. 匹配语言前缀
            const prefix = lang ? lang.split('-')[0] : '';
            const prefixMatches = voices.filter(v => v.lang.startsWith(prefix));
            if (prefixMatches.length) return prefixMatches[0];

            return null;
        }

        function speakText(btn, text, lang, rate) {
            // 如果正在朗读，先停止
            if (currentUtterance) {
                window.speechSynthesis.cancel();
                document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
                if (btn && btn.classList.contains('speaking')) return;
            }

            if (!window.speechSynthesis) {
                alert('您的浏览器不支持语音朗读功能');
                return;
            }

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = lang || 'en-US';
            // 英语和粤语默认稍慢一点，更清晰
            if (lang && lang.startsWith('en')) {
                utter.rate = rate || 0.9;
            } else {
                utter.rate = rate || 0.95;
            }
            utter.pitch = 1;       // 标准音调
            utter.volume = 1;

            // 选择最佳发音人
            const bestVoice = pickBestVoice(utter.lang);
            if (bestVoice) utter.voice = bestVoice;

            if (btn) btn.classList.add('speaking');
            currentUtterance = utter;

            utter.onend = () => {
                if (btn) btn.classList.remove('speaking');
                currentUtterance = null;
            };
            utter.onerror = () => {
                if (btn) btn.classList.remove('speaking');
                currentUtterance = null;
            };

            // Chrome bug: 有时需要先 cancel 再 speak
            window.speechSynthesis.cancel();
            setTimeout(() => window.speechSynthesis.speak(utter), 50);
        }

        // 语音识别跟读
        let recognition = null;
        let activeFollowBtn = null;

        function initRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const rec = new SR();
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 3;
            return rec;
        }

        function levenshtein(s1, s2) {
            const m = s1.length, n = s2.length;
            const d = Array.from({length: m+1}, () => new Array(n+1).fill(0));
            for (let i = 0; i <= m; i++) d[i][0] = i;
            for (let j = 0; j <= n; j++) d[0][j] = j;
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    const cost = s1[i-1].toLowerCase() === s2[j-1].toLowerCase() ? 0 : 1;
                    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
                }
            }
            return d[m][n];
        }

        function calcAccuracy(spoken, target) {
            const s = spoken.toLowerCase().replace(/[^a-z\u4e00-\u9fff\s]/g, '').trim();
            const t = target.toLowerCase().replace(/[^a-z\u4e00-\u9fff\s]/g, '').trim();
            if (!t) return 0;
            if (!s) return 0;
            const dist = levenshtein(s, t);
            const maxLen = Math.max(s.length, t.length);
            return Math.round((1 - dist / maxLen) * 100);
        }

        function startFollow(btn, targetText, lang) {
            // 如果正在录音，先停止
            if (recognition && activeFollowBtn) {
                recognition.stop();
                activeFollowBtn.classList.remove('recording');
                activeFollowBtn = null;
                return;
            }

            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                alert('您的浏览器不支持语音识别功能，请使用 Chrome 或 Edge 浏览器');
                return;
            }

            // 先朗读一遍
            speakText(null, targetText, lang);

            // 朗读结束后开始录音
            const speakTimer = setTimeout(() => {
                recognition = initRecognition();
                if (!recognition) {
                    alert('语音识别初始化失败');
                    return;
                }
                recognition.lang = lang || 'en-US';

                btn.classList.add('recording');
                activeFollowBtn = btn;
                btn.innerHTML = '⏹️ 停止录音';

                // 找到结果容器
                const card = btn.closest('.dialogue-line-actions') || btn.closest('.follow-section');
                let resultDiv = card ? card.parentElement.querySelector('.follow-result') : null;
                if (!resultDiv) {
                    resultDiv = btn.closest('.word-card, .content-card, .dialogue-card')?.querySelector('.follow-result');
                }

                recognition.onresult = (event) => {
                    const spoken = event.results[0][0].transcript;
                    const accuracy = calcAccuracy(spoken, targetText);

                    let cls = 'fail', label = '再试一次';
                    if (accuracy >= 80) { cls = 'success'; label = '太棒了！'; }
                    else if (accuracy >= 60) { cls = 'partial'; label = '不错，继续努力'; }

                    if (resultDiv) {
                        resultDiv.className = 'follow-result show ' + cls;
                        resultDiv.innerHTML = `
                            <strong>${label}</strong>
                            <div>目标：${targetText}</div>
                            <div class="heard">你说：${spoken}</div>
                            <div class="accuracy">准确度：${accuracy}%</div>
                        `;
                    }
                };

                recognition.onerror = (event) => {
                    if (resultDiv) {
                        resultDiv.className = 'follow-result show fail';
                        resultDiv.innerHTML = '<strong>未识别到语音</strong><div>请检查麦克风权限，或点击重试</div>';
                    }
                };

                recognition.onend = () => {
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎤 跟读';
                    activeFollowBtn = null;
                };

                try {
                    recognition.start();
                } catch(e) {
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎤 跟读';
                    activeFollowBtn = null;
                }
            }, targetText.length * 80 + 500);
        }

        function startFollowPhrase(btn, targetText, lang) {
            startFollow(btn, targetText, lang);
        }

        // 预加载语音列表
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // ========== 导航 ==========
        function renderPage(pageKey) {
            const data = pageData[pageKey];
            if (!data) return;
            contentArea.innerHTML = data.render();
            contentArea.scrollTop = 0;
        }

        sidebar.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                sidebar.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                renderPage(item.dataset.page);
            });
        });

        renderPage('speaking');
    </script>
</body>
</html>
